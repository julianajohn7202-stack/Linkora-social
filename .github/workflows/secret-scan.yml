name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history lets TruffleHog scan every commit on the branch/PR,
          # not just the tip — catches secrets added and then "removed".
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.28
        with:
          # On a PR, scan only the commits introduced by the branch so the job
          # stays fast and the signal stays focused. On a push to main, scan
          # the full history.
          extra_args: >-
            --only-verified
            --fail

      # False-positive allowlist: create .trufflehog.yml at the repo root to
      # exclude known test fixtures or example credentials.
      # See: https://github.com/trufflesecurity/trufflehog#configuration
