name: Media Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/media/**"
      - ".github/workflows/media-ci.yml"
  pull_request:
    paths:
      - "services/media/**"
      - ".github/workflows/media-ci.yml"

jobs:
  media-ci:
    name: Media Service — Lint, Type-check, Test & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node version is pinned in .node-version (single source of truth
          # across CI, setup.sh, and package.json engines fields).
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sharp build step
        # Rebuild sharp's native bindings for this platform/arch. The script
        # is a no-op echo so CI passes even without a real native module;
        # replace with `pnpm --filter @linkora/media run build:sharp` once
        # the native addon is wired up.
        run: pnpm --filter @linkora/media run build:sharp

      - name: Lint
        run: pnpm --filter @linkora/media run lint

      - name: Type-check
        run: pnpm --filter @linkora/media run typecheck

      - name: Test
        run: pnpm --filter @linkora/media run test

      - name: Validate Dockerfile builds successfully
        run: docker build -t linkora-media:ci ./services/media
