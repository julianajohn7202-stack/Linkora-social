name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmation input must be exactly 'DEPLOY'. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://linkora.xyz
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run pre-deployment checks
        run: pnpm test

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          # Add your actual deployment steps here
          # e.g. docker push, kubectl apply, etc.
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}

      - name: Create deployment summary
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "- **Status**: Success ✅"
            echo "- **Deployed by**: ${{ github.actor }}"
            echo "- **Commit**: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- **Timestamp**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } >> "$GITHUB_STEP_SUMMARY"
