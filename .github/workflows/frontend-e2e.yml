name: Frontend E2E Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-e2e.yml"

jobs:
  e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node version is pinned in .node-version (single source of truth
          # across CI, setup.sh, and package.json engines fields).
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Set up environment variables for localhost testing
        run: |
          echo "NEXT_PUBLIC_API_URL=http://localhost:3001" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_INDEXER_URL=http://localhost:3001" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SOROBAN_RPC_URL=http://localhost:8000/rpc" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_NETWORK_PASSPHRASE=Standalone Network ; February 2017" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CONTRACT_ID=CBQHLSNMBF4HS3UX2PV72T75V2SXE7M2EZZTQ6YC5DSXIGGY4NPSAFAF" >> $GITHUB_ENV

      - name: Build web application
        run: pnpm --filter apps-web build

      - name: Start mock server and preview server
        run: |
          node apps/web/e2e-mocks/server.js &
          pnpm --filter apps-web preview --port 3000 &
          npx wait-on http://localhost:3000 http://localhost:3001/health http://localhost:8000/health --timeout 60000

      - name: Run E2E tests
        id: e2e
        working-directory: apps/web
        env:
          CI: true
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 30

      # Traces and screenshots are only produced for failing tests
      # (trace: on-first-retry, screenshot: only-on-failure in playwright.config.ts).
      # Uploading them unconditionally on failure avoids storing browser
      # artifacts for green runs while still giving engineers everything
      # needed to diagnose a remote failure.
      - name: Upload traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: e2e-failure-artifacts-${{ github.run_id }}
          path: apps/web/test-results/
          retention-days: 7
