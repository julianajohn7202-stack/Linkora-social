name: Migration Tests

on:
  push:
    branches:
      - main
    paths:
      - "services/indexer/migrations/**"
      - "services/dm-relay/migrations/**"
      - "tests/migrations/**"
      - "docker-compose.migrations.yml"
      - ".github/workflows/migrations.yml"
      - "scripts/summarize_migrations.py"
  pull_request:
    paths:
      - "services/indexer/migrations/**"
      - "services/dm-relay/migrations/**"
      - "tests/migrations/**"
      - "docker-compose.migrations.yml"
      - ".github/workflows/migrations.yml"
      - "scripts/summarize_migrations.py"

jobs:
  migrations:
    name: Indexer DB Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Record migration start time
        run: echo "MIGRATION_START_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run migration test suite
        id: run_migrations
        env:
          MIGRATION_TIMING_REPORT: ${{ runner.temp }}/migration-timings.md
        run: bash tests/migrations/test-migrations.sh

      - name: Verify migration count (016–020 must be present)
        id: verify_count
        run: |
          EXPECTED_MIN=20
          ACTUAL=$(ls services/indexer/migrations/*.sql | wc -l)
          echo "Migration files found: $ACTUAL"
          if [ "$ACTUAL" -lt "$EXPECTED_MIN" ]; then
            echo "ERROR: expected at least $EXPECTED_MIN migration files, found $ACTUAL" >&2
            exit 1
          fi
          echo "✅ Migration count OK ($ACTUAL files)"

      - name: Add migration summary
        if: always()
        env:
          START_SECONDS: ${{ env.MIGRATION_START_SECONDS }}
          RUN_STATUS: ${{ steps.run_migrations.outcome }}
          VERIFY_STATUS: ${{ steps.verify_count.outcome }}
        run: |
          python scripts/summarize_migrations.py
          if [[ -f "$RUNNER_TEMP/migration-timings.md" ]]; then
            cat "$RUNNER_TEMP/migration-timings.md" >> "$GITHUB_STEP_SUMMARY"
          fi
