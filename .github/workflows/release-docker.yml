name: Release — Docker Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  docker-release:
    name: Build & tag Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: indexer
            context: services/indexer
            image: linkora/indexer
          - name: dm-relay
            context: services/dm-relay
            image: linkora/dm-relay
          - name: analytics-oracle
            context: services/analytics-oracle
            image: linkora/analytics-oracle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add release summary
        run: |
          echo "### Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ matrix.service.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ matrix.service.image }}:v${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
