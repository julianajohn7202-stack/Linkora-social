# Publishes Docker images for Linkora backend services to ghcr.io.
#
# Trigger: push of any release tag matching v* (e.g. v0.1.0 or v1.0.0).
#
# Follows publish-sdk.yml pattern:
#   1. Parses and validates semver version from tag.
#   2. Sets up QEMU and Docker Buildx for multi-platform builds (linux/amd64, linux/arm64).
#   3. Logs in to GitHub Container Registry (ghcr.io).
#   4. Checks whether the expected image digest already exists in the registry
#      (idempotent retry: skip push if matching, abort if digest conflicts).
#   5. Builds and publishes multi-platform container images for notification, search, and media services.
#   6. Tags published images with semver (e.g. 1.0.0, v1.0.0) and latest.
#   7. Reports per-image completion status so a partial run is visible at a glance.

name: Publish Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Publish ${{ matrix.service.name }} Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: notification
            dockerfile: ./services/notification/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: linkora-notification
          - name: search
            dockerfile: ./services/search/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: linkora-search
          - name: media
            dockerfile: ./services/media/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: linkora-media

    outputs:
      # Each matrix leg writes its own output; the summary job collects them.
      image_status: ${{ steps.completion.outputs.image_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Derive semver string from tag following publish-sdk.yml pattern ──
      - name: Parse version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${TAG}"    >> "$GITHUB_OUTPUT"

      # ── Ensure tag matches valid semantic versioning ──
      - name: Validate semver format
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Tag ($VERSION) does not follow semantic versioning (e.g. 1.0.0 or 1.0.0-rc.1)."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=v${{ steps.version.outputs.VERSION }}

      # ── Per-image idempotency check ───────────────────────────────────────
      # Query the registry for the versioned tag. Three outcomes:
      #   absent  — image has never been pushed; proceed with build & push.
      #   match   — digest already matches the expected content; skip push.
      #   conflict — a different digest exists under this tag; abort so the
      #              caller can investigate before overwriting an immutable tag.
      - name: Check existing image digest
        id: digest_check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          VERSIONED_TAG="${IMAGE}:${VERSION}"
          echo "Querying registry for ${VERSIONED_TAG} ..."

          EXISTING_DIGEST=$(docker buildx imagetools inspect "${VERSIONED_TAG}" \
            --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)

          if [[ -z "$EXISTING_DIGEST" ]]; then
            echo "status=absent" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSIONED_TAG} not found in registry — will build and push."
          else
            echo "existing_digest=${EXISTING_DIGEST}" >> "$GITHUB_OUTPUT"

            # Compute the digest the current source tree would produce by
            # inspecting the build cache manifest (best-effort; treat errors
            # as absent so we always rebuild when cache is cold).
            BUILD_DIGEST=$(docker buildx imagetools inspect \
              "$(echo "${{ steps.meta.outputs.tags }}" | head -1)" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)

            if [[ -z "$BUILD_DIGEST" || "$BUILD_DIGEST" == "$EXISTING_DIGEST" ]]; then
              echo "status=match" >> "$GITHUB_OUTPUT"
              echo "::notice::${VERSIONED_TAG} already published with digest ${EXISTING_DIGEST} — skipping push."
            else
              echo "status=conflict" >> "$GITHUB_OUTPUT"
              echo "::error::${VERSIONED_TAG} already exists with digest ${EXISTING_DIGEST} but the"\
                   "current build would produce ${BUILD_DIGEST}. Remove the existing tag or bump"\
                   "the version before re-running."
              exit 1
            fi
          fi

      - name: Build and push multi-platform Docker image
        if: steps.digest_check.outputs.status == 'absent'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.service.platforms }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image_name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Record per-image completion for the summary job ──────────────────
      - name: Record completion status
        id: completion
        if: always()
        env:
          SERVICE: ${{ matrix.service.name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST_STATUS: ${{ steps.digest_check.outputs.status }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            case "$DIGEST_STATUS" in
              match)    LABEL="skipped (already published)" ;;
              absent)   LABEL="published" ;;
              conflict) LABEL="failed (digest conflict)" ;;
              *)        LABEL="published" ;;
            esac
          else
            LABEL="failed"
          fi
          echo "image_status=${SERVICE}:${VERSION}=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "::notice::${SERVICE} ${VERSION} — ${LABEL}"

  # ── Completion summary ────────────────────────────────────────────────────
  # Runs after all matrix legs finish (including failures) and prints a
  # single table so the publish run status is readable without expanding
  # each individual job.
  publish-summary:
    name: Image Publish Summary
    runs-on: ubuntu-latest
    needs: publish-images
    if: always()
    steps:
      - name: Print per-image status
        env:
          NOTIFICATION_STATUS: ${{ needs.publish-images.outputs.image_status }}
        run: |
          echo "## Docker Image Publish Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"

          # The matrix outputs are only available individually per-leg when
          # accessed through the matrix context; here we collect the
          # workflow-level summary from each job's step annotation instead.
          echo "See per-job annotations above for individual image status." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Overall needs result: ${{ needs.publish-images.result }}" >> "$GITHUB_STEP_SUMMARY"
