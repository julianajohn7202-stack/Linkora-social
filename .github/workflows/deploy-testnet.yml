name: Deploy Testnet

on:
  workflow_dispatch:
  push:
    tags:
      - "release/*"

permissions:
  contents: read

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.ADMIN_SECRET }}" ] && [ -n "${{ secrets.TREASURY_ADDRESS }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build, Deploy, Codegen, Canary
    runs-on: ubuntu-latest
    needs: secrets-check
    if: needs.secrets-check.outputs.available == 'true'
    # Gate every production deployment behind required-reviewer approval.
    # The `production` environment must be configured in GitHub repository
    # settings (Settings → Environments) with the desired reviewers and branch
    # policy. See .github/environments/production.yml for setup instructions.
    environment: production
    env:
      NETWORK: testnet
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
      FEE_BPS: ${{ vars.FEE_BPS || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config libudev-dev libhidapi-dev

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM, deploy contract, initialize
        id: deploy
        run: ./scripts/deploy_testnet.sh

      - name: Write contract ID to artifact file
        run: |
          mkdir -p deployment-artifacts
          cat <<EOF > deployment-artifacts/contract-id.json
          {
            "network": "$NETWORK",
            "contract_id": "${{ steps.deploy.outputs.contract_id }}",
            "tag": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload contract ID as release artifact
        uses: actions/upload-artifact@v7
        with:
          name: testnet-contract-id-${{ github.ref_name }}
          path: deployment-artifacts/contract-id.json
          retention-days: 90

      - name: Add deployment summary
        run: |
          {
            echo "## Linkora Testnet deployment"
            echo ""
            echo "- Network: $NETWORK"
            echo "- Tag: \`${{ github.ref_name }}\`"
            echo "- CONTRACT_ID: \`${{ steps.deploy.outputs.contract_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run codegen against deployed contract
        env:
          NEXT_PUBLIC_CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: pnpm codegen

      - name: Prepare SDK canary version
        working-directory: packages/sdk
        run: |
          node <<'NODE'
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const base = pkg.version.split('-')[0];
            const stamp = new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 14);
            pkg.version = `${base}-canary.${stamp}.${process.env.GITHUB_RUN_NUMBER}`;
            delete pkg.private;
            pkg.main = './dist/index.js';
            pkg.types = './dist/index.d.ts';
            pkg.files = ['dist'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Build SDK
        working-directory: packages/sdk
        run: pnpm build

      - name: Publish SDK canary
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag next

      - name: Notify Telegram — success
        if: success()
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *Linkora Testnet Deploy — SUCCESS*

            • Tag: `${{ github.ref_name }}`
            • Contract ID: `${{ steps.deploy.outputs.contract_id }}`
            • Network: `testnet`
            • Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram — failure
        if: failure()
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *Linkora Testnet Deploy — FAILED*

            • Tag: `${{ github.ref_name }}`
            • Network: `testnet`
            • Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
