name: Notification Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/notification/**"
      - ".github/workflows/notification-ci.yml"
  pull_request:
    paths:
      - "services/notification/**"
      - ".github/workflows/notification-ci.yml"
  workflow_dispatch:

jobs:
  notification-ci:
    name: Notification Service — lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 3

    defaults:
      run:
        working-directory: services/notification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint notification service
        run: pnpm run lint

      - name: Type-check notification service
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test
