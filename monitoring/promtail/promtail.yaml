# Promtail configuration — scrapes Docker container logs and ships to Loki.
#
# Labels applied to every log stream:
#   job        = "linkora"
#   service    = container name (from Docker label "service", or container name)
#   container  = raw Docker container name

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: linkora-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          # Only scrape containers that belong to the Linkora compose network.
          - name: label
            values: ["logging=loki"]
    relabel_configs:
      # Use the Docker container name as the service label when available.
      - source_labels: ["__meta_docker_container_label_service"]
        target_label: service
        replacement: "$1"

      # Fall back to the container name (strip leading slash).
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container

      # Always tag with a constant job label.
      - target_label: job
        replacement: linkora

      # Forward the log stream.
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

    pipeline_stages:
      # Parse Pino / JSON log lines emitted by all Linkora services.
      - json:
          expressions:
            level: level
            service: service
            request_id: request_id
            msg: msg

      # Promote parsed fields to Loki labels for fast filtering.
      - labels:
          level:
          service:

      # Use the timestamp from the log line itself, not ingestion time.
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339

      # Set the log message to the parsed `msg` field.
      - output:
          source: msg
