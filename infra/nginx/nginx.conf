# Linkora Nginx Reverse Proxy Configuration
#
# Routes traffic to the three backend services and enforces infrastructure-
# level rate limiting on the media upload endpoint.
#
# Rate limiting:
#   - Media uploads (POST /api/posts, POST /api/posts/*/media):
#       max 10 requests per minute per client IP
#       burst of 2 to absorb brief spikes
#       429 Too Many Requests with Retry-After: 60 on violation
#
# Upstream services:
#   indexer         → port 3000
#   dm-relay        → port 3001
#   analytics-oracle → port 4000

# ── Rate-limit zones ──────────────────────────────────────────────────────────
# Keyed by binary client IP to minimise memory usage. The 10m zone can track
# roughly 160 000 unique IPs before LRU eviction begins.

# Media upload: 10 uploads per minute per IP
limit_req_zone $binary_remote_addr zone=media_upload:10m rate=10r/m;

# Global API read: 100 requests per minute per IP (defence-in-depth)
limit_req_zone $binary_remote_addr zone=api_read:10m rate=100r/m;

# Return 429 (not the nginx default 503) for rate-limited requests.
limit_req_status 429;

# ── Map: set Retry-After only on 429 responses ────────────────────────────────
# nginx's add_header is evaluated per-location; using a map keeps this DRY.
map $status $retry_after_value {
    429 "60";
    default "";
}

# ── Upstreams ─────────────────────────────────────────────────────────────────

upstream indexer {
    server indexer:3000;
    keepalive 32;
}

upstream dm_relay {
    server dm-relay:3001;
    keepalive 16;
}

upstream analytics_oracle {
    server analytics-oracle:4000;
    keepalive 8;
}

# ── Server block ──────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Pass real client IP to upstream services.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Always emit Retry-After on 429 responses.
    add_header Retry-After $retry_after_value always;

    # ── Media upload endpoints — rate limited ─────────────────────────────────
    # POST /api/posts          — create a post (may include a media file)
    # POST /api/posts/*/media  — upload media for an existing post
    #
    # Allow a burst of 2 to absorb short bursts from mobile clients without
    # immediately triggering 429. nodelay ensures the burst is served instantly
    # rather than being queued (avoids artificially high latency at the limit).

    location ~ ^/api/posts(/[^/]+/media)?$ {
        limit_except POST GET OPTIONS {
            deny all;
        }

        # Rate limit only POST (media upload); GET reads are handled by the
        # general API block below. Use $request_method in the key to keep the
        # zone exclusively for write traffic.
        limit_req zone=media_upload burst=2 nodelay;

        proxy_pass http://indexer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Support large multipart media uploads (default nginx limit is 1 MB).
        client_max_body_size 50m;
    }

    # ── Indexer API (general) ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_read burst=20 nodelay;

        proxy_pass http://indexer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        client_max_body_size 1m;
    }

    # Indexer WebSocket
    location /ws {
        proxy_pass http://indexer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Indexer health + metrics (no rate limiting — probed frequently by
    # orchestrators and the monitoring stack)
    location ~ ^/(health|metrics) {
        proxy_pass http://indexer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── DM Relay ──────────────────────────────────────────────────────────────
    location /relay/ {
        proxy_pass http://dm_relay/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        client_max_body_size 1m;
    }

    # DM Relay WebSocket
    location /relay/ws {
        proxy_pass http://dm_relay/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── Analytics Oracle ──────────────────────────────────────────────────────
    location /oracle/ {
        proxy_pass http://analytics_oracle/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Default: 404 ─────────────────────────────────────────────────────────
    location / {
        return 404;
    }
}
