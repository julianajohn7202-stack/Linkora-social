# Grafana datasource provisioning — Prometheus
# This file is automatically loaded by Grafana on startup.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: linkora-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
