# Linkora Alerting Rules
#
# Covers notification dispatch, indexer pipeline health, and service
# availability. All thresholds are tunable via relabelling or Alertmanager
# routing rules without editing this file.

groups:
  # ── Notification Service ──────────────────────────────────────────────────
  - name: notification_service
    interval: 60s
    rules:
      # Fire when the ratio of failed dispatches to total dispatches exceeds
      # 5 % over a 5-minute window. A dispatch error indicates a push-token
      # failure, database write error, or missing device-token lookup.
      - alert: NotificationDispatchErrorRateHigh
        expr: |
          (
            rate(notification_dispatch_errors_total[5m])
            /
            clamp_min(rate(notification_dispatch_total[5m]), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: linkora-notification-service
        annotations:
          summary: "Notification dispatch error rate > 5%"
          description: >
            The notification dispatch error rate on {{ $labels.instance }} has
            exceeded 5% for the past 5 minutes
            (current value: {{ printf "%.1f" (mul $value 100) }}%).
            Check push-token validity and database connectivity.
          runbook: "https://github.com/ijayabby/Linkora-social/blob/main/docs/deployment.md#monitoring-and-alerting"

      # Fire when no notifications have been dispatched in the last 15 minutes
      # while the service is running. This can indicate a stalled pipeline or
      # broken event bus connection.
      - alert: NotificationDispatchSilent
        expr: |
          increase(notification_dispatch_total[15m]) == 0
          and on(instance) up{job="linkora-notification-service"} == 1
        for: 15m
        labels:
          severity: warning
          service: linkora-notification-service
        annotations:
          summary: "No notifications dispatched in 15 minutes"
          description: >
            No notifications have been dispatched on {{ $labels.instance }}
            in the last 15 minutes. The notification pipeline may be stalled.

  # ── Indexer Pipeline ──────────────────────────────────────────────────────
  - name: indexer_pipeline
    interval: 60s
    rules:
      - alert: IndexerDown
        expr: up{job="linkora-indexer"} == 0
        for: 2m
        labels:
          severity: critical
          service: linkora-indexer
        annotations:
          summary: "Linkora indexer is down"
          description: "The indexer on {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: IndexerSerializationRetriesHigh
        expr: rate(serialization_retries_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: linkora-indexer
        annotations:
          summary: "Elevated PostgreSQL serialization retries on indexer"
          description: >
            Serialization retries on {{ $labels.instance }} are {{ $value }}/s
            over the last 5 minutes, indicating database contention.

  # ── DM Relay ─────────────────────────────────────────────────────────────
  - name: dm_relay
    interval: 60s
    rules:
      - alert: DmRelayDown
        expr: up{job="linkora-dm-relay"} == 0
        for: 2m
        labels:
          severity: critical
          service: linkora-dm-relay
        annotations:
          summary: "Linkora DM relay is down"
          description: "The DM relay on {{ $labels.instance }} has been unreachable for more than 2 minutes."

  # ── Analytics Oracle ─────────────────────────────────────────────────────
  - name: analytics_oracle
    interval: 60s
    rules:
      - alert: AnalyticsOracleDown
        expr: up{job="linkora-analytics-oracle"} == 0
        for: 2m
        labels:
          severity: critical
          service: linkora-analytics-oracle
        annotations:
          summary: "Linkora analytics oracle is down"
          description: "The analytics oracle on {{ $labels.instance }} has been unreachable for more than 2 minutes."
